name: opensim-torque-rt
channels:
  - opensim-org
  - conda-forge
  - pytorch
dependencies:
  - python=3.11
  - opensim=4.5.2
  - numpy<2
  - scipy>=1.10,<1.14
  - trimesh
  - tqdm
  - matplotlib
  - pytorch
  - cvxpy
  - pandas
  - pyyaml
  - rtree
  - shapely
  - pip
  - pip:
      - smplx
      - nimblephysics
      - meshio
      - open3d
      - loguru
      - omegaconf
      - pyrender
