name: opensim-torque
channels:
  - opensim-org
  - conda-forge
  - pytorch
dependencies:
  - python=3.11
  - opensim=4.5.2
  - numpy<2
  - scipy>=1.10,<1.14
  - pyyaml
  - cvxpy
  - trimesh
  - rtree
  - shapely
  - tqdm
  - pandas
  - matplotlib
  - pytorch
  - pip
  - pip:
      - smplx
      - nimblephysics
      - meshio
      - open3d
      - loguru
      - omegaconf
      - pyrender
      - --no-build-isolation
      - git+https://github.com/vchoutas/torch-trust-ncg.git
